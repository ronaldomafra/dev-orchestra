<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <style>
      .box { fill: #fafafa; stroke: #333; stroke-width: 2; rx: 6; }
      .memory { fill: #f1f3f5; stroke: #555; stroke-width: 2; stroke-dasharray: 7 5; rx: 6; }
      .card { fill: #fff; stroke: #777; stroke-width: 1.5; rx: 4; }
      .title { font-family: monospace; font-size: 22px; font-weight: 700; fill: #111; }
      .label { font-family: monospace; font-size: 17px; font-weight: 700; fill: #222; }
      .small { font-family: monospace; font-size: 14px; fill: #444; }
      .line { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line-bi { stroke: #333; stroke-width: 2; fill: none; marker-start: url(#arrow); marker-end: url(#arrow); }
      .memory-line { stroke: #555; stroke-width: 1.7; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#ffffff"/>

  <!-- Trello / Task Source -->
  <rect class="box" x="55" y="205" width="245" height="275"/>
  <text class="label" x="82" y="240">Task Source</text>
  <text class="small" x="82" y="265">Trello inicialmente</text>
  <rect class="card" x="82" y="295" width="190" height="42"/>
  <text class="small" x="98" y="321">Backlog</text>
  <rect class="card" x="82" y="350" width="190" height="42"/>
  <text class="small" x="98" y="376">Em andamento</text>
  <rect class="card" x="82" y="405" width="190" height="42"/>
  <text class="small" x="98" y="431">Validação / Done</text>

  <!-- Orchestrator -->
  <rect class="box" x="430" y="145" width="330" height="190"/>
  <text class="label" x="485" y="185">Orchestrator Session</text>
  <text class="small" x="475" y="220">planeja • delega • acompanha</text>
  <text class="small" x="475" y="247">consolida • atualiza backlog</text>
  <text class="small" x="475" y="274">mantém contexto mínimo</text>

  <!-- Dev -->
  <rect class="box" x="390" y="435" width="250" height="145"/>
  <text class="label" x="455" y="475">Dev Session</text>
  <text class="small" x="420" y="510">implementação isolada</text>
  <text class="small" x="420" y="536">branch / worktree</text>

  <!-- QA -->
  <rect class="box" x="690" y="435" width="250" height="145"/>
  <text class="label" x="765" y="475">QA Session</text>
  <text class="small" x="718" y="510">testes e regressão</text>
  <text class="small" x="718" y="536">evidência objetiva</text>

  <!-- AI Memory -->
  <rect class="memory" x="865" y="120" width="280" height="235"/>
  <text class="label" x="932" y="165">AI Memory</text>
  <text class="small" x="900" y="202">memória durável compartilhada</text>
  <text class="small" x="900" y="230">decisões • padrões • contexto</text>
  <text class="small" x="900" y="258">handoff entre sessões / CLIs</text>
  <text class="small" x="900" y="298">todas as sessões iniciam</text>
  <text class="small" x="900" y="322">através do AI Memory</text>

  <!-- Human -->
  <circle cx="590" cy="70" r="24" fill="#fff" stroke="#333" stroke-width="2"/>
  <path d="M590 94 L590 120 M568 108 L612 108 M590 120 L572 140 M590 120 L608 140" stroke="#333" stroke-width="2" fill="none"/>

  <!-- Connections -->
  <path class="line-bi" d="M300 340 C350 340 380 255 430 255"/>
  <path class="line" d="M535 335 C520 370 510 395 510 435"/>
  <path class="line" d="M655 335 C700 370 775 390 805 435"/>
  <path class="line" d="M640 508 C662 508 672 508 690 508"/>

  <path class="memory-line" d="M760 215 C805 200 830 195 865 195"/>
  <path class="memory-line" d="M640 500 C745 430 815 355 900 330"/>
  <path class="memory-line" d="M940 500 C1010 450 1020 395 1020 355"/>

  <text class="small" x="330" y="317">ler / atualizar</text>
  <text class="small" x="450" y="390">handoff</text>
  <text class="small" x="730" y="390">handoff</text>
  <text class="small" x="650" y="492">resultado / evidência</text>
</svg>
