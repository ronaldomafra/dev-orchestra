<circle cx="274" cy="831" r="12" fill="#2b8a3e"/>
<text x="274" y="836" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">7</text>
<text x="294" y="836" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start">devolve STATUS · CHANGES · VALIDATION ·</text>
<text x="294" y="860" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start">RISKS · EVIDÊNCIAS ao RETURN_TO</text>
<rect x="760" y="706" width="480" height="176" rx="14" fill="#ffffff" stroke="#7048e8" stroke-width="2.5" stroke-dasharray="9 6"/>
<text x="782" y="742" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#7048e8" text-anchor="start">Planner · QA</text>
<text x="1218" y="742" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#52606d" text-anchor="end">opcionais</text>
<text x="782" y="776" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start">Planner analisa e decompõe; não implementa</text>
<text x="782" y="804" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start">QA valida critérios; não corrige em silêncio</text>
<text x="782" y="832" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start">mesmo protocolo de handoff e retorno</text>
<text x="782" y="860" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">nenhum worker altera o Task Source</text>
