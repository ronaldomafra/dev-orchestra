<rect x="262" y="490" width="466" height="122" rx="10" fill="#ffffff" stroke="#3e4c59" stroke-width="1.8"/>
<text x="282" y="520" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start">Codex</text>
<text x="282" y="546" font-family="Noto Sans Mono, DejaVu Sans Mono, monospace" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">codex app-server --listen ws://127.0.0.1:4500</text>
<text x="282" y="570" font-family="Noto Sans Mono, DejaVu Sans Mono, monospace" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">codex queue --thread &lt;nome|UUID&gt; --message …</text>
<text x="282" y="594" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="start">o retorno chega quando o turno termina</text>
<rect x="752" y="490" width="466" height="122" rx="10" fill="#ffffff" stroke="#c15f3c" stroke-width="1.8"/>
<text x="772" y="520" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#c15f3c" text-anchor="start">Claude Code</text>
<text x="772" y="546" font-family="Noto Sans Mono, DejaVu Sans Mono, monospace" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">claude --name &lt;papel&gt; [--agent &lt;papel&gt;]</text>
<text x="772" y="570" font-family="Noto Sans Mono, DejaVu Sans Mono, monospace" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">SendMessage(to: &quot;developer&quot;, …)</text>
<text x="772" y="594" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="start">mesmo modo de permissão; confira /list-agents</text>
