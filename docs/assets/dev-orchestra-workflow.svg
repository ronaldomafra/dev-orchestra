<text x="990" y="141" font-family="Noto Sans Mono, DejaVu Sans Mono, monospace" font-size="14" font-weight="400" fill="#cbd2d9" text-anchor="end">workstream orchestrator</text>
<circle cx="502" cy="181" r="12" fill="#3e4c59"/>
<text x="502" y="186" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="524" y="186" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start">Lê o card e confirma os critérios no código</text>
<circle cx="502" cy="208" r="12" fill="#3e4c59"/>
<text x="502" y="213" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="524" y="213" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start">Move o card para Em execução</text>
<circle cx="502" cy="235" r="12" fill="#3e4c59"/>
<text x="502" y="240" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="524" y="240" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start">Recomenda MODEL / EFFORT e pede aprovação</text>
<circle cx="502" cy="262" r="12" fill="#3e4c59"/>
<text x="502" y="267" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="524" y="267" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start">Envia o handoff com RETURN_TO</text>
<circle cx="502" cy="289" r="12" fill="#3e4c59"/>
<text x="502" y="294" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="524" y="294" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start">Encerra o turno — sem sleep nem polling</text>
<circle cx="502" cy="316" r="12" fill="#3e4c59"/>
<text x="502" y="321" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">8</text>
<text x="524" y="321" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start">Confere cada critério e evidência</text>
<circle cx="502" cy="343" r="12" fill="#3e4c59"/>
<text x="502" y="348" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">9</text>
<text x="524" y="348" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start">Registra as evidências e conclui o card</text>
