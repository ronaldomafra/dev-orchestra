<text x="40" y="58" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#1f2933" text-anchor="start">Dev Orchestra — fluxo de trabalho</text>
<text x="40" y="92" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#52606d" text-anchor="start">O mesmo ciclo em Codex ou Claude Code: muda só o transporte entre sessões. Cada papel roda no próprio terminal.</text>
