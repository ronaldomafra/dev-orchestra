<text x="62" y="200" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">• define prioridades</text>
<text x="62" y="228" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">• aprova modelo e esforço</text>
<text x="62" y="256" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">• decide produto,</text>
<text x="62" y="284" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">   arquitetura e risco</text>
