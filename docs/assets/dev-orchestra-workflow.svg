<text x="698" y="742" font-family="Noto Sans Mono, DejaVu Sans Mono, monospace" font-size="14" font-weight="400" fill="#52606d" text-anchor="end">workstream developer</text>
<text x="262" y="776" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start">lê git status e preserva mudanças locais</text>
<circle cx="274" cy="801" r="12" fill="#2b8a3e"/>
<text x="274" y="806" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text>
